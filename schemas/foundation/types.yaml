id: https://w3id.org/gckg/foundation/types
name: gckg_foundation_types
title: GCKG foundation types
description: Shared base classes for nodes and reified relationships.
version: 0.1.0

imports:
  - prefixes
  - linkml:types

default_prefix: gckg

classes:

  UniversalContainer:
    tree_root: true
    slots:
      - entries

  BaseEntity:
    abstract: true

  Node:
    is_a: BaseEntity
    abstract: true
    slots:
      - id
      - name
      - labels

  Concept:
    is_a: Node
    abstract: true
    class_uri: skos:Concept

  Entity:
    is_a: Node
    abstract: true
    class_uri: prov:Entity

  Activity:
    is_a: Entity
    class_uri: prov:Activity

  Agent:
    is_a: Entity
    class_uri: prov:Agent

  Document:
    is_a: Entity

  Membership:
    is_a: Concept

  Organization:
    is_a: Agent
    class_uri: org:Organization

  Person:
    is_a: Agent
    class_uri: foaf:Person

  Role:
    is_a: Concept
    class_uri: org:Role

  Relationship:
    is_a: BaseEntity
    description: A reified subject–predicate–object triple between two nodes.
    attributes:
      id:
        range: string
        identifier: true
      subject:
        range: string
        description: ID of the source node.
      predicate:
        range: string
        description: Relationship type label.
      object:
        range: string
        description: ID of the target node.
