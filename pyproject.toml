[project]
name = "gckg-ingest"
version = "0.1.0"
description = "Knowledge graph of Canadian political and associated entities."
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
validate = ["linkml>=1.9.0"]
ontology = ["linkml>=1.9.0", "rdflib>=7.0"]

[project.scripts]
ingest = "ingest.cli:main"
validate = "validate.cli:main"
transforms = "transforms.cli:main"
integrate = "integrate.cli:main"
publish = "publish.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*", "validate*", "transforms*", "integrate*", "publish*"]

[tool.pytest.ini_options]
testpaths = [
  "ingest/tests",
  "validate/tests",
  "transforms/tests",
  "integrate/tests",
  "publish/tests",
  "tools/ontology_insights/tests",
]
